# ─────────────────────────────────────────────────────────────────────────────
# k8s/ingress.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Exposes the game at https://<YOUR_DOMAIN> via an nginx Ingress Controller.
# TLS is terminated at the Ingress using a cert-manager Certificate.
#
# Prerequisites (install once per cluster):
#   • nginx Ingress Controller  — https://kubernetes.github.io/ingress-nginx
#   • cert-manager              — https://cert-manager.io
#   • A ClusterIssuer named "letsencrypt-prod" (see note below)
#
# Placeholders to replace before applying:
#   <YOUR_DOMAIN>   — e.g.  bombjack.example.com
#
# Apply:
#   kubectl apply -f k8s/ingress.yaml
#
# ── cert-manager ClusterIssuer (apply this once, separately) ─────────────────
#
#   apiVersion: cert-manager.io/v1
#   kind: ClusterIssuer
#   metadata:
#     name: letsencrypt-prod
#   spec:
#     acme:
#       server: https://acme-v02.api.letsencrypt.org/directory
#       email: <YOUR_EMAIL>
#       privateKeySecretRef:
#         name: letsencrypt-prod-key
#       solvers:
#         - http01:
#             ingress:
#               class: nginx
#
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bombjack
  namespace: default
  labels:
    app: bombjack
  annotations:
    # ── Ingress class ──────────────────────────────────────────────────────────
    kubernetes.io/ingress.class: "nginx"

    # ── TLS / cert-manager ────────────────────────────────────────────────────
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

    # ── nginx tuning ──────────────────────────────────────────────────────────
    # The game is pure static files; no request body is expected.
    nginx.ingress.kubernetes.io/proxy-body-size:         "1m"
    # Aggressive browser-side caching for the hashed JS bundle.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
    # Force HTTPS — redirect any plain-HTTP request to HTTPS.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

spec:
  tls:
    - hosts:
        - <YOUR_DOMAIN>
      secretName: bombjack-tls   # cert-manager will populate this Secret

  rules:
    - host: <YOUR_DOMAIN>
      http:
        paths:
          - path:     /
            pathType: Prefix
            backend:
              service:
                name: bombjack
                port:
                  name: http

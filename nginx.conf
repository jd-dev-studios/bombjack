# nginx.conf
# ──────────────────────────────────────────────────────────────────────────────
# Minimal nginx server block for a Vite SPA.
#
# Key behaviours:
#   • Serves all static assets from /usr/share/nginx/html.
#   • Falls back to index.html for any path that isn't a real file — required
#     for client-side routing (not currently used, but correct by default).
#   • Sets long-lived cache headers on the hashed JS/CSS bundles produced by
#     Vite (filenames contain a content hash so they are safe to cache forever).
#   • Sends a no-cache header for index.html itself so browsers always fetch
#     the latest entry-point after a new deploy.
#   • Enables gzip compression for text assets.
# ──────────────────────────────────────────────────────────────────────────────

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Compression ───────────────────────────────────────────────────────────
    gzip            on;
    gzip_types      text/plain text/css application/javascript
                    application/json image/svg+xml;
    gzip_min_length 1024;

    # ── Hashed static assets — cache for 1 year ───────────────────────────────
    location ~* \.(?:js|css|woff2?|png|jpg|svg|ico)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # ── index.html — never cache ──────────────────────────────────────────────
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files  $uri =404;
    }

    # ── SPA fallback — all other paths serve index.html ───────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
